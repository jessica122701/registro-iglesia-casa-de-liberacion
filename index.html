<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Casa de Liberación</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card-login {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .card-login h1 {
            color: #0b5ed7;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .card-login h2 {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: normal;
        }

        /* BANNER DESTACADO PARA EL FORMULARIO PÚBLICO */
        .bloque-publico {
            background-color: #e8f5e9;
            border: 2px solid #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .bloque-publico p {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
            color: #1b5e20;
        }

        .btn-publico {
            display: block;
            background-color: #198754;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 3px 8px rgba(25, 135, 84, 0.3);
        }

        .btn-publico:hover {
            background-color: #157347;
        }

        .separador {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            margin: 20px 0;
        }

        .separador::before, .separador::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #cbd5e1;
        }

        .separador span {
            padding: 0 10px;
        }

        /* Formulario de Admin */
        .campo {
            text-align: left;
            margin-bottom: 15px;
        }
        .campo label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }
        .campo input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .campo input:focus {
            border-color: #0b5ed7;
        }
        .btn-entrar {
            width: 100%;
            background-color: #0b5ed7;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-entrar:hover {
            background-color: #0a58ca;
        }
    </style>
</head>
<body>

    <div class="card-login">
        <h1>Casa de Liberación y Restauración</h1>
        <h2>Sistema de Registro y Membresía</h2>

        <!-- BOTÓN PÚBLICO GRANDE Y DESTACADO -->
        <div class="bloque-publico">
            <p>¿Eres miembro, líder, amigo o vas a registrar a un niño?</p>
            <a href="registro.html" class="btn-publico">📝 Llenar Ficha de Registro</a>
        </div>

        <div class="separador"><span>O INICIA SESIÓN SI ERES ADMIN</span></div>

        <!-- ACCESO SOLO PARA ADMINISTRADORES -->
        <form id="formLogin">
            <div class="campo">
                <label for="usuario">Usuario Administrador</label>
                <input type="text" id="usuario" placeholder="Ej. admin" required>
            </div>
            <div class="campo">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-entrar">🔐 Entrar al Panel</button>
        </form>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
